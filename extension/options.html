<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meet Dashboard Reset</title>
    <style>
      body { font: 14px/1.5 Roboto, Arial, sans-serif; margin: 24px; max-width: 420px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
      button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
      #status { margin-left: 10px; color: #188038; }
      #status.error { color: #d93025; }
    </style>
  </head>
  <body>
    <label for="url">Dashboard home URL (initial state)</label>
    <input id="url" type="url" placeholder="http://localhost:8337/" />
    <div>
      <button id="save">Save</button>
      <span id="status"></span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
